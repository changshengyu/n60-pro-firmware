name: Build N60 PRO firmware
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel build jobs (use 2 for standard private runners)
        default: '2'
        required: true
      config_only:
        description: Validate feeds and resolved configuration without compiling
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: n60-pro-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      FORCE_UNSAFE_CONFIGURE: '1'
      BUILD_JOBS: ${{ inputs.jobs }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Disposable hosted runner only; make room for the cross toolchain.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            libelf-dev libzstd-dev zstd liblzma-dev libtool autoconf automake \
            autopoint cmake ninja-build pkgconf help2man texinfo gperf \
            subversion device-tree-compiler squashfs-tools ccache patch \
            ca-certificates xxd jq time
          df -h
          free -h
      - name: Fetch locked sources and validate configuration
        id: prepare
        run: python3 scripts/prepare.py 2>&1 | tee prepare.log
      - name: Restore downloads and compiler caches
        id: cache
        if: ${{ !inputs.config_only }}
        uses: actions/cache/restore@v4
        with:
          path: |
            build/dl
            build/.ccache
            build/tmp/go-build
          key: n60-${{ runner.os }}-${{ hashFiles('sources.lock.json', 'config/profile.config') }}-${{ github.run_id }}
          restore-keys: |
            n60-${{ runner.os }}-${{ hashFiles('sources.lock.json', 'config/profile.config') }}-
            n60-${{ runner.os }}-
      - name: Download and compile
        if: ${{ !inputs.config_only }}
        run: bash scripts/build.sh
      - name: Upload firmware and matching packages
        if: ${{ !inputs.config_only }}
        uses: actions/upload-artifact@v4
        with:
          name: n60-pro-6.6-high-power-passwall-istore-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - name: Save downloads and compiler caches
        if: ${{ always() && !inputs.config_only && steps.prepare.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build/dl
            build/.ccache
            build/tmp/go-build
          key: n60-${{ runner.os }}-${{ hashFiles('sources.lock.json', 'config/profile.config') }}-${{ github.run_id }}
      - name: Preserve configuration and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            sources.lock.json
            config/
            prepare.log
            logs/
            build/.config
            build/logs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
